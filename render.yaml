services:
  - type: web
    name: gestao-recria
    runtime: node
    plan: starter
    buildCommand: node --check server.js
    startCommand: node server.js
    healthCheckPath: /health
    disk:
      name: registros
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        generateValue: true

